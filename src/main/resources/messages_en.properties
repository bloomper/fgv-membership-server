mail.link.body=Hi!\n\nHere you can pay your FGV membership fee for {3}.\n\nAmount: {0} kr\nReference: {1} (keep it unchanged in the message)\n\nPay here, by Swish or bank transfer, and tell us when you have paid:\n{2}
