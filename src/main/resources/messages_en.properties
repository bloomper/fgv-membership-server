mail.payment.reminder.subject=Reminder: pay your membership fee, reference {0}
mail.payment.reminder.body=Hi!\n\nYou asked to pay your FGV membership fee but we have not seen a payment yet. If you have paid, ignore this message, or tell us on the payment page.\n\nAmount: {0} kr\nReference: {1} (keep it unchanged in the message)\nSwish: {2}\nBank account: {3}\n\nPay or report your payment: {4}
