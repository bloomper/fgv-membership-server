mail.access.body=Hej!\n\nDu har nu tillgång till {0}:\n{1}
mail.rejected.subject=Din registrering godkändes inte
mail.rejected.body=Hej!\n\nDin registrering har inte godkänts och kontot har tagits bort.{0}
mail.rejected.message=\n\nMeddelande från administratören:\n{0}
mail.newuser.subject=Ny användare väntar på godkännande
mail.newuser.body={0} ({1}) har registrerat sig och verifierat sin e-postadress.\n{2}\nGodkänn användaren genom att ge hen tillgång till en applikation:\n{3}
mail.newuser.message=\nMeddelande från användaren:\n{0}\n
mail.payment.reminder.subject=Påminnelse: betala medlemsavgiften, referens {0}
mail.payment.reminder.body=Hej!\n\nDu bad om att få betala din medlemsavgift till FGV, men vi har ännu inte sett någon betalning. Har du redan betalat kan du bortse från det här meddelandet, eller säga till på betalningssidan.\n\nBelopp: {0} kr\nReferens: {1} (behåll den oförändrad i meddelandet)\nSwish: {2}{3}\n\nBetala eller anmäl att du har betalat: {4}
mail.payment.receipt.subject=Kvitto: medlemsavgift till FGV
mail.payment.receipt.body=Hej!\n\nTack. Vi har tagit emot din betalning på {0} kr (referens {1}) för medlemskap i FGV: {2}.
mail.account.subject=Ett konto har skapats åt dig
mail.account.body=Hej!\n\nTack för din betalning. Vi har skapat ett konto åt dig på {0}, där du kan se ditt medlemskap och logga in i FGV:s applikationer.\n\nDu får ett separat mejl från vår inloggningstjänst med en länk där du väljer lösenord. Länken gäller i 7 dagar.\n
mail.payment.admin.note=\n{0}
mail.payment.admin.reported.subject={0} säger sig ha betalat {1} kr
mail.payment.admin.reported.body={0} har sagt att medlemsavgiften är betald.\n\nBelopp: {1} kr\nReferens: {2}\nAvser: {3}{4}\n\nHitta betalningen och registrera den: {5}
mail.payment.admin.online.subject={0} har betalat {1} kr i webbutiken
mail.payment.admin.online.body={0} har betalat medlemsavgiften i webbutiken. Medlemskapet räknas redan.\n\nBelopp: {1} kr\nReferens: {2}\nAvser: {3}{4}\n\nBetalningar: {5}
mail.payment.admin.already_member.subject={0} har betalat {1} kr men är redan medlem
mail.payment.admin.already_member.body={0} har betalat {1} kr i webbutiken för {3}, men är redan medlem det året. Ingenting registrerades; en återbetalning kan behövas.\n\nOrder: {2}{4}\n\nBetalningar: {5}
mail.renewal.subject=Förnya ditt medlemskap i FGV
mail.renewal.intro=Hej!\n\nDags att förnya medlemskapet i FGV för {0}.
mail.renewal.details=Belopp: {0} kr\nReferens: {1} (behåll den oförändrad i meddelandet)\n\nBetala här, med Swish eller banköverföring, och säg till när du har betalat:\n{2}\n\nVill du inte få fler påminnelser kan du välja det på sidan.
