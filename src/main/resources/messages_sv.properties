mail.verify.subject=Bekräfta din e-postadress
mail.verify.body=Hej!\n\nTack för att du registrerat dig. Bekräfta din e-postadress och välj lösenord genom att öppna länken nedan. Länken gäller i {1} timmar.\n\n{0}\n\nHar du inte registrerat dig kan du bortse från det här meddelandet.
mail.exists.subject=Någon försökte registrera din e-postadress
mail.exists.body=Hej!\n\nNågon försökte registrera ett konto med den här e-postadressen, men du har redan ett. Var det du kan du logga in här:\n\n{0}\n\nHar du glömt lösenordet kan du välja nytt på inloggningssidan.
mail.approved.subject=Ditt konto är godkänt
mail.approved.none=Hej!\n\nDitt konto har godkänts och du kan nu logga in.
mail.approved.list=Hej!\n\nDitt konto har godkänts och du kan nu logga in i:\n\n{0}
